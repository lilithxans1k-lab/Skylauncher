name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release as this version (e.g. 0.2.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  client-fabric:
    name: Client mod (26.2 Fabric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: client-mod/fabric
      - uses: actions/upload-artifact@v4
        with:
          name: client-fabric
          path: client-mod/fabric/build/libs/skylaunch-client-fabric-*.jar

  client-forge:
    name: Client mod (1.8.9 Forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: client-mod/forge189
      - uses: actions/upload-artifact@v4
        with:
          name: client-forge
          path: client-mod/forge189/build/libs/skylaunch-client-forge-1.8.9-*.jar

  launcher:
    name: Windows installer
    needs: [client-fabric, client-forge]
    runs-on: windows-latest
    permissions:
      contents: write   # lets a release upload the installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Put client jars where the launcher expects them
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources/client | Out-Null
          Get-ChildItem artifacts/client-fabric/*.jar | Select-Object -First 1 | Copy-Item -Destination resources/client/skylaunch-client-fabric.jar
          Get-ChildItem artifacts/client-forge/*.jar | Select-Object -First 1 | Copy-Item -Destination resources/client/skylaunch-client-forge-1.8.9.jar
      - run: npm ci
      - run: npm run check
      - run: npm run test:client
      - name: Decide version
        id: ver
        shell: bash
        run: |
          V=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; fi
          if [[ -n "${{ github.event.inputs.release_version }}" ]]; then V="${{ github.event.inputs.release_version }}"; V="${V#v}"; fi
          if [[ -n "$V" ]]; then
            npm version "$V" --no-git-tag-version --allow-same-version
            echo "publish=always" >> "$GITHUB_OUTPUT"
            echo "Releasing SkyLaunch $V"
          else
            echo "publish=never" >> "$GITHUB_OUTPUT"
          fi
      - name: Build installer
        shell: bash
        env:
          # No code-signing certificate: build an unsigned installer.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx electron-builder --win nsis --publish ${{ steps.ver.outputs.publish }} 2>&1 | tee dist.log || { tail -n 40 dist.log | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: SkyLaunch-installer
          path: dist/*.exe
